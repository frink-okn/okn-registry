  description: "The nde (NIAID Data Ecosystem) knowledge graph is a dataset-discovery\
    \ index for finding biomedical research datasets \u2014 including gene-expression\
    \ / transcriptomics data (RNA-seq, microarray, single-cell / single-nucleus),\
    \ other -omics, clinical, epidemiological, imaging, and flow-cytometry data \u2014\
    \ searchable by disease or condition, organism, and source repository. It mirrors\
    \ dataset metadata from NCBI GEO, ArrayExpress, and 70+ repositories; coverage\
    \ is deepest for infectious and immune-mediated disease (its NIAID mission) but,\
    \ because it indexes general-purpose repositories such as GEO, it also covers\
    \ datasets for many non-infectious diseases and conditions (e.g. cancer, diabetes,\
    \ kidney disease). Use it to find and triage candidate datasets for a specific\
    \ disease \u2014 for example when assembling studies for a pooled or meta-analysis\
    \ of differential gene expression. It stores dataset-level metadata and links\
    \ to the primary repository; it does NOT store per-sample data or computed differential-expression\
    \ values (log2 fold changes / p-values)."
  frink-options:
    documentation-path: nde
    kgf:
      semantics:
        authoritative_namespaces:
        - wobd-okn
        prefixes:
          ror: https://ror.org/
          schema: http://schema.org/
          uniprot-taxonomy: https://www.uniprot.org/taxonomy/
          wobd-okn: https://okn.wobd.org/
        roles:
          label:
          - http://schema.org/name
          - http://schema.org/alternateName
