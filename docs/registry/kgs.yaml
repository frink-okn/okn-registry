  description: "Query pre-computed differential gene expression (log2 fold changes\
    \ and adjusted p-values) for genes across diseases, tissues, cell types, developmental\
    \ stages, and sex, drawn from a curated selection of 243 EMBL-EBI Expression Atlas\
    \ studies. Use this graph to retrieve computed differential-expression results\
    \ and expression associations for the studies it includes. It is a hand-picked\
    \ subset, NOT a comprehensive index of the gene-expression datasets available\
    \ for a given disease \u2014 to discover the full set of datasets for a condition\
    \ (for example when assembling studies for your own pooled or meta-analysis),\
    \ use a dataset-discovery index such as the NIAID Data Ecosystem (nde) graph."
