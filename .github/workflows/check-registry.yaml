name: Check registry files
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/registry/kgs/*.md"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check-registry.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.4"
      - name: Check YAML frontmatter of KG registry files
        run: uv run scripts/check_registry.py
      - name: Run script unit tests
        run: uv run python -m unittest -v
